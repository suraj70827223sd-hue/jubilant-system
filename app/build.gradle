plugins { id 'com.android.application' }

android {
    namespace 'com.connect8.infinity'
    compileSdk 35
    defaultConfig {
        applicationId 'com.connect8.infinity'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.browser:browser:1.8.0'
}
